# XorAPI 配置文件示例
# 说明：正式部署时无需手动创建此文件，访问 /install 安装向导会自动生成。
# 此文件用于参考字段含义，或供高级用户手动部署。

server:
  port: 8080              # 监听端口
  site_name: "XorAPI"     # 站点名称
  jwt_secret: ""          # JWT 签名密钥（安装向导自动生成 64 位随机 hex）
  encrypt_key: ""         # 渠道 API Key 加密密钥，32 字节（64 位 hex），自动生成
  data_dir: "./data"      # 数据目录（安装锁、自定义模板存放于此）

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "your-mysql-password"
  name: xorapi            # 数据库需为 utf8mb4 编码

redis:
  host: 127.0.0.1         # 留空则不启用 Redis（限流与计数回退内存模式）
  port: 6379
  password: ""
  db: 0
